info:
  name: Get Product
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiv1}}/products/{{created_product_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Uses the ID saved by **Create Product**. A `200` returns the product in `data`, including `availableStock` when it has inventory.
  A malformed UUID returns `400`. An unknown product returns `404`.

info:
  name: Delete Product
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{apiv1}}/products/{{created_product_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Deletes the product saved by **Create Product** after the collection has used it for **Create Order**.
  Returns `204` with an empty body, `400` for a malformed UUID, or `404` for an unknown product.

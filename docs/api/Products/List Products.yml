info:
  name: List Products
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiv1}}/products"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Returns `200` with a product array in `data`, sorted by ID. `limit` defaults to 25 (range 1–100), and `offset` defaults to 0 (range 0–2147483647).

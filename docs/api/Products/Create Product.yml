info:
  name: Create Product
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiv1}}/products"
  body:
    type: json
    data: |-
      {
        "name": "Bruno Test Product",
        "type": "PHYSICAL",
        "unitPriceMinor": "12900",
        "initialStock": 3
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setVar("created_product_id", res.getBody().data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: Stream Events
  type: http
  seq: 2

http:
  method: GET
  url: '{{apiv1}}/audit/stream'
  headers:
    - name: Accept
      value: text/event-stream
  auth: inherit

docs: |-
  This server-sent events connection emits new audit records inserted by the instance serving the stream. Each message carries the audit record ID and the same record shape as **List Events**. Use **List Events** for stored history.

info:
  name: List Events
  type: http
  seq: 1

http:
  method: GET
  url: '{{apiv1}}/audit?per_page=10'
  auth: inherit

docs: |-
  Returns `{ items, nextCursor }` in `data`, newest first. Each item contains `id`, `event` (the routing key), `createdAt`, and `payload`.
  Use `page` and `per_page`, or pass the returned `nextCursor` as `cursor` to continue. The cursor takes precedence over the page offset.

info:
  name: List Orders
  type: http
  seq: 3

http:
  method: GET
  url: '{{apiv1}}/orders?page=1&per_page=10'
  auth: inherit

docs: |-
  Returns `{ orders, page, per_page }` in `data`. Use `customerId` or `status` to filter. Results are sorted by creation time and ID descending.
  The defaults are `page=1` and `per_page=10`. A page size can be 1–100.

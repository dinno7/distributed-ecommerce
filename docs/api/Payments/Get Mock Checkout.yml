info:
  name: Get Mock Checkout
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiv1}}/payments/{{payment_id}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: if (!bru.getCollectionVar("payment_id")) bru.runner.skipRequest();

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Run **Get Latest Payment** until it saves `payment_id`. This request uses the API route. Wait for a non-null `checkoutUrl` as a readiness signal.
  Returns `200` with the checkout in `data`, including `paymentId`, `orderId`, `status`, `amountMinor`, and `currency`. An invalid UUID returns `400`. An unknown payment or a payment from another gateway returns `404`.

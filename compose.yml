services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine3.24}
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dinno}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-1234}
      - POSTGRES_DB=${POSTGRES_DB:-snapshop}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
